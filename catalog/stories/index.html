<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="./theme-loader.js"></script>
    <script type="module" src="./demo.js"></script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
    />
    <style>
      :root {
        --md-sys-color-primary: #FFE100;
        --md-sys-color-on-primary: #191F28;
        --md-sys-color-primary-container: #FFF6A6;
        --md-sys-color-on-primary-container: #191F28;
        --md-sys-color-surface: #FFFFFF;
        --md-sys-color-surface-container: #FFFFFF;
        --md-sys-color-surface-container-high: #F8F9FA;
        --md-sys-color-surface-container-highest: #F2F4F6;
        --md-sys-color-on-surface: #191F28;
        --md-sys-color-on-surface-variant: #4E5968;
        --md-sys-color-outline: #D1D6DB;
        --md-sys-color-outline-variant: #E5E8EB;
        --md-sys-shape-corner-extra-large: 24px;
        --md-sys-typescale-font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        --md-ref-typeface-plain: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        --md-ref-typeface-brand: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background-color: var(--md-sys-color-surface, #FFFFFF);
        color: var(--md-sys-color-on-surface, #191F28);
        font-family: var(--md-ref-typeface-plain);
        letter-spacing: -0.02em;
      }

      body {
        margin: 0;
        font-family: inherit;
        background-color: var(--md-sys-color-surface, #FFFFFF);
        color: var(--md-sys-color-on-surface, #191F28);
      }
    </style>
  </head>
  <body></body>
</html>
